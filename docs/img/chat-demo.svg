<g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.0250;0.1562;1.0000" dur="16.0s" repeatCount="indefinite" calcMode="discrete"/><clipPath id="c4"><rect x="28" y="670" height="30" width="0"><animate attributeName="width" values="0;0;252;252" keyTimes="0;0.0250;0.1375;1" dur="16.0s" repeatCount="indefinite"/></rect></clipPath><text x="30" y="690" fill="#e6e8ec" clip-path="url(#c4)">Keep my Mac on until my Cursor ag…</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.1562;0.9688;1.0000" dur="16.0s" repeatCount="indefinite" calcMode="discrete"/><rect x="142" y="70" width="262" height="76" rx="16" fill="#2f6fed"/><text x="155" y="95" fill="#fff">Keep my Mac on until my Cursor</text><text x="155" y="115" fill="#fff">agent finishes, and let me know</text><text x="155" y="135" fill="#fff">when it&#x27;s done.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.1750;0.2500;1.0000" dur="16.0s" repeatCount="indefinite" calcMode="discrete"/><rect x="16" y="158" width="64" height="36" rx="16" fill="#262a33"/><circle cx="34" cy="176" r="4" fill="#9aa0aa"><animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="48" cy="176" r="4" fill="#9aa0aa"><animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.2s" repeatCount="indefinite"/></circle><circle cx="62" cy="176" r="4" fill="#9aa0aa"><animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.4s" repeatCount="indefinite"/></circle></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.2500;0.9688;1.0000" dur="16.0s" repeatCount="indefinite" calcMode="discrete"/><rect x="16" y="158" width="315" height="76" rx="16" fill="#262a33"/><text x="29" y="183" fill="#fff">On it. Your Mac stays awake while</text><text x="29" y="203" fill="#fff">the agent in checkout-api is</text><text x="29" y="223" fill="#fff">running. I&#x27;ll text you when it&#x27;s done.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.3750;0.9688;1.0000" dur="16.0s" repeatCount="indefinite" calcMode="discrete"/><rect x="16" y="246" width="284" height="76" rx="16" fill="#262a33"/><text x="29" y="271" fill="#fff">✅ The checkout-api agent finished:</text><text x="29" y="291" fill="#fff">added rate limiting, all 48 tests</text><text x="29" y="311" fill="#fff">pass. Your Mac can sleep now.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.4500;0.5563;1.0000" dur="16.0s" repeatCount="indefinite" calcMode="discrete"/><clipPath id="c72"><rect x="28" y="670" height="30" width="0"><animate attributeName="width" values="0;0;215;215" keyTimes="0;0.4500;0.5375;1" dur="16.0s" repeatCount="indefinite"/></rect></clipPath><text x="30" y="690" fill="#e6e8ec" clip-path="url(#c72)">Nice. Anything waiting on me?</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.5563;0.9688;1.0000" dur="16.0s" repeatCount="indefinite" calcMode="discrete"/><rect x="158" y="334" width="246" height="36" rx="16" fill="#2f6fed"/><text x="171" y="359" fill="#fff">Nice. Anything waiting on me?</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.5750;0.6500;1.0000" dur="16.0s" repeatCount="indefinite" calcMode="discrete"/><rect x="16" y="382" width="64" height="36" rx="16" fill="#262a33"/><circle cx="34" cy="400" r="4" fill="#9aa0aa"><animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="48" cy="400" r="4" fill="#9aa0aa"><animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.2s" repeatCount="indefinite"/></circle><circle cx="62" cy="400" r="4" fill="#9aa0aa"><animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.4s" repeatCount="indefinite"/></circle></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.6500;0.9688;1.0000" dur="16.0s" repeatCount="indefinite" calcMode="discrete"/><rect x="16" y="382" width="277" height="56" rx="16" fill="#262a33"/><text x="29" y="407" fill="#fff">One thing: the agent wants to run</text><text x="29" y="427" fill="#fff">git push. Run it?</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.7125;0.7812;1.0000" dur="16.0s" repeatCount="indefinite" calcMode="discrete"/><clipPath id="c114"><rect x="28" y="670" height="30" width="0"><animate attributeName="width" values="0;0;89;89" keyTimes="0;0.7125;0.7625;1" dur="16.0s" repeatCount="indefinite"/></rect></clipPath><text x="30" y="690" fill="#e6e8ec" clip-path="url(#c114)">Yes, run it.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.7812;0.9688;1.0000" dur="16.0s" repeatCount="indefinite" calcMode="discrete"/><rect x="287" y="450" width="117" height="36" rx="16" fill="#2f6fed"/><text x="300" y="475" fill="#fff">Yes, run it.</text></g>
