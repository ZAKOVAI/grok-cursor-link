<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720" width="420" height="720" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14">
<title>Example conversation with the Cursor Link bot</title>
